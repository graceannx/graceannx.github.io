<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grace Richardson | Portfolio</title>
    <meta
      name="description"
      content="Personal portfolio — director, photographer & moving image."
    />
    <meta name="theme-color" content="#f1f1f0" />

    <!-- Fonts: 'Circle' on the reference is a proprietary geometric sans.
         Poppins is the closest free geometric substitute. Swap freely. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="bg-surface text-ink">
    <!-- Fixed frosted-glass name pill (top-left) -->
    <a class="name-pill" href="#top" aria-label="Back to top">
      <span>Grace Richardson</span>
    </a>

    <!-- Theme toggle (top-right) -->
    <button class="theme-toggle" type="button" aria-label="Toggle light / dark">
      light / dark
    </button>

    <main id="top">
      <!-- =========================================================
           HERO — full-viewport featured card with caption below.
           Drop an <img> or <video> inside .media (see notes in main.js).
           ========================================================= -->
      <section class="hero">
        <a class="feature" href="#gallery" aria-label="View selected work">
          <figure class="media reveal" data-parallax="0.12" data-project="the moment">
            <!-- Replace this placeholder with your media -->
            <div class="media__placeholder" data-label="hero — featured">
              <!-- <video src="your-video.mp4" autoplay muted loop playsinline></video> -->
              <!-- <img src="your-image.jpg" alt="Project name" /> -->
            </div>
          </figure>
          <div class="caption">
            <span class="caption__name">Grace Richardson</span>
            <span class="caption__title">the moment</span>
          </div>
        </a>
      </section>

      <!-- =========================================================
           FEED — staggered two-column layout rendered from the
           `projects` array in main.js so you can add / reorder media.
           ========================================================= -->
      <section class="gallery" id="gallery" aria-label="Selected work"></section>

      <!-- Footer info -->
      <footer class="footer">
        <div class="footer__group">
          <div class="footer__col">
            <span class="footer__label">connect</span>
            <ol>
              <li><a href="mailto:hello@yourname.com">hello@yourname.com</a></li>
              <li><a href="#" target="_blank" rel="noopener">instagram</a></li>
            </ol>
          </div>
        </div>
        <div class="footer__group">
          <div class="footer__col">
            <span class="footer__label">info</span>
            <ol>
              <li>© <span id="year"></span> grace richardson</li>
              <li>all rights reserved</li>
            </ol>
          </div>
        </div>
      </footer>
    </main>

    <!-- Fixed bottom status bar: name (left) / current project (right) -->
    <div class="statusbar" aria-hidden="true">
      <span class="statusbar__name">grace richardson</span>
      <span class="statusbar__project" id="current-project">the moment</span>
    </div>

    <script src="main.js"></script>
  </body>
</html>
